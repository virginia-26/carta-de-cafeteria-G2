
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wöllen - Tu Opinión</title>

    <link rel="stylesheet" href="archivos_css/opinion.css">
</head>

<body>

    <!-- =====================================
         ENCABEZADO
         ===================================== -->

    <header>

        <h1>
            <a href="inicio.html">
                ← WÖLLEN
            </a>
        </h1>

        <h2>
            Contanos tu opinión
        </h2>

        <p>
            Tu experiencia nos ayuda a mejorar cada día.
        </p>

        <p>
            <a href="comentarios.html" class="link-volver">
                Ver opiniones de otros clientes
            </a>
        </p>

    </header>


    <!-- =====================================
         CONTENIDO PRINCIPAL
         ===================================== -->

    <main>

        <form id="form-opinion">


            <!-- =====================================
                 DATOS PERSONALES
                 ===================================== -->

            <div class="grupo-datos">

                <div class="campo-formulario">

                    <label for="nombre">
                        Nombre:
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                    >

                </div>


                <div class="campo-formulario">

                    <label for="apellido">
                        Apellido:
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Tu apellido"
                    >

                </div>

            </div>


            <!-- =====================================
                 PRODUCTOS
                 ===================================== -->

            <fieldset>

                <legend>
                    ¿Qué producto/s consumiste?
                </legend>


                <div class="opciones-productos">

                    <label>
                        <input
                            type="checkbox"
                            id="prod-desayunos"
                            name="producto"
                            value="Desayunos y Meriendas"
                        >
                        Desayunos y Meriendas
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            id="prod-tortas"
                            name="producto"
                            value="Tortas y Tostados"
                        >
                        Tortas y Tostados
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            id="prod-dulces"
                            name="producto"
                            value="Dulces, Clásicos y Tentaciones"
                        >
                        Dulces, Clásicos y Tentaciones
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            id="prod-cafeteria"
                            name="producto"
                            value="Cafetería"
                        >
                        Cafetería
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            id="prod-bebidas"
                            name="producto"
                            value="Bebidas"
                        >
                        Bebidas
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            id="prod-copas"
                            name="producto"
                            value="Copas Heladas"
                        >
                        Copas Heladas
                    </label>

                </div>

            </fieldset>


            <!-- =====================================
                 CALIFICACIÓN
                 ===================================== -->

            <fieldset>

                <legend>
                    Calificación
                </legend>


                <div class="opciones-calificacion">

                    <label>
                        <input
                            type="radio"
                            id="cal-1"
                            name="calificacion"
                            value="1"
                        >
                        1
                    </label>


                    <label>
                        <input
                            type="radio"
                            id="cal-2"
                            name="calificacion"
                            value="2"
                        >
                        2
                    </label>


                    <label>
                        <input
                            type="radio"
                            id="cal-3"
                            name="calificacion"
                            value="3"
                        >
                        3
                    </label>


                    <label>
                        <input
                            type="radio"
                            id="cal-4"
                            name="calificacion"
                            value="4"
                        >
                        4
                    </label>


                    <label>
                        <input
                            type="radio"
                            id="cal-5"
                            name="calificacion"
                            value="5"
                        >
                        5
                    </label>

                </div>

            </fieldset>


            <!-- =====================================
                 COMENTARIO
                 ===================================== -->

            <div class="campo-formulario campo-comentario">

                <label for="comentario">
                    Tu comentario:
                </label>

                <textarea
                    id="comentario"
                    name="comentario"
                    rows="5"
                    placeholder="Contanos qué te pareció..."
                ></textarea>

            </div>


            <!-- =====================================
                 BOTÓN
                 ===================================== -->

            <div class="contenedor-boton">

                <button
                    type="button"
                    id="btn-enviar"
                >
                    Enviar opinión
                </button>

            </div>

        </form>

    </main>


    <!-- =====================================
         FOOTER
         ===================================== -->

    <footer>

        <p>
            Wöllen Heladería y Cafetería
        </p>

    </footer>


    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="opinion.js"></script>

</body>

</html>
